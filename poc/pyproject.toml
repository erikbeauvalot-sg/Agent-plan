[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagagent"
version = "0.1.0"
description = "POC de l'agent IA de diagnostic de production"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "openai>=1.60",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "argon2-cffi>=23",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]
claude = ["anthropic>=1.12,<2"]
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27"]

[project.scripts]
diagagent = "diagagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diagagent = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests en parallèle, un processus par cœur : chaque test lance ses serveurs MCP, la suite passe de
# 3 min à moins d'une. Un seul test, sans parallélisme : pytest -n 0 tests/test_x.py::test_y
addopts = "-n auto"
