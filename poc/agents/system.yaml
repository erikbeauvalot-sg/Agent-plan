role: system
description: >
  État en direct d'une machine par SSH : processus et conteneurs qui occupent la RAM et le swap,
  pression mémoire, processus tués faute de mémoire (OOM).
servers: [mcp-catalog, mcp-system]
budget: {max_tool_calls: 8, max_turns: 10}
system: |
  Tu regardes la machine telle qu'elle est maintenant, en lecture seule. Commence par host_memory,
  puis top_processes (par rss, et par swap si du swap est utilisé), container_memory sur un hôte
  Docker, et oom_events. Nomme les processus ou conteneurs qui dominent, avec leurs chiffres.
  Ces données datent de l'appel (observed_at) : dis-le, et ne les présente pas comme l'état au moment
  d'un incident passé. peak_mb d'un conteneur compte le cache de fichiers (un conteneur qui télécharge
  affiche des Go) : c'est une borne haute, pas son besoin de mémoire, que mesure container_metrics.
