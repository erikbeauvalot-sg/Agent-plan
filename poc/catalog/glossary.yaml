# Vocabulaire métier : alias de services et noms normalisés des métriques.
services:
  PAY: {name: Paiement, aliases: [paiement, paiements, payment, "service paiement", carte]}
  WEB: {name: Portail client, aliases: [portail, site web, portail client]}
  FRONT: {name: Front réseau, aliases: [front, répartiteur, load balancer]}
metrics:
  up: "Cible de collecte joignable (1) ou non (0)"
  cpu.usage: "Utilisation CPU en %"
  load.1m: "Charge système moyenne sur 1 minute"
  disk.used_pct: "Remplissage du système de fichiers le plus plein, en %"
  disk.io_util_pct: "Occupation du disque le plus chargé, en %"
  net.rx_bytes_s: "Débit réseau reçu, octets par seconde"
  net.tx_bytes_s: "Débit réseau émis, octets par seconde"
  net.errors_s: "Erreurs réseau par seconde"
  mem.used_pct: "Mémoire utilisée en %"
  mem.pressure_pct: "Part du temps où des tâches attendent de la mémoire (PSI), en % ; au-dessus de 0, la RAM manque vraiment"
  mem.oom_kills: "Processus tués par le noyau faute de mémoire (OOM killer), par tranche de 5 min"
  swap.used_pct: "Swap occupé en % ; seul, il ne prouve pas un manque de RAM actuel (pages anciennes restées en swap)"
  swap.in_pages_s: "Pages relues depuis le swap par seconde ; non nul en continu : la machine manque de RAM"
  swap.out_pages_s: "Pages envoyées vers le swap par seconde ; un pic date le moment où la RAM a manqué"
  http.latency_p95: "Latence HTTP au 95e centile en ms"
  db.connections: "Connexions actives sur la base"
  db.max_connections: "Paramètre max_connections de la base"
  container.mem_mb: "Mémoire de travail d'un conteneur Docker (cAdvisor), en Mo"
  container.swap_mb: "Swap d'un conteneur Docker (cAdvisor), en Mo"
  container.cpu_pct: "CPU d'un conteneur Docker (cAdvisor), en % d'un cœur"
  container.oom_events: "Événements OOM d'un conteneur Docker, par tranche de 5 min"
