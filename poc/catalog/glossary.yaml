# Vocabulaire métier : alias de services et noms normalisés des métriques.
services:
  PAY: {name: Paiement, aliases: [paiement, paiements, payment, "service paiement", carte]}
  WEB: {name: Portail client, aliases: [portail, site web, portail client]}
  FRONT: {name: Front réseau, aliases: [front, répartiteur, load balancer]}
metrics:
  up: "Cible de collecte joignable (1) ou non (0)"
