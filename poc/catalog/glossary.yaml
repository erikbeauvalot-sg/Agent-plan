  load.1m: "Charge système moyenne sur 1 minute"
  disk.used_pct: "Remplissage du système de fichiers le plus plein, en %"
  disk.io_util_pct: "Occupation du disque le plus chargé, en %"
  net.rx_bytes_s: "Débit réseau reçu, octets par seconde"
  net.tx_bytes_s: "Débit réseau émis, octets par seconde"
  net.errors_s: "Erreurs réseau par seconde"
  mem.used_pct: "Mémoire utilisée en %"
  http.latency_p95: "Latence HTTP au 95e centile en ms"
  db.connections: "Connexions actives sur la base"
  db.max_connections: "Paramètre max_connections de la base"
