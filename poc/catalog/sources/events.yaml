id: events
kind: documents
demo: true                     # source de démonstration, désactivée par DIAGAGENT_DEMO=0
description: >
  Alertes de supervision (une par déclenchement), avec le contrôle en cause et sa sévérité.
  À utiliser pour dater le début d'un symptôme et voir les alertes corrélées sur les dépendances.
backend: {type: file, path: demo_data/events.json}
time_field: "@timestamp"
entity_keys: {host: host}
fields:
  severity: {type: keyword, values: [minor, major, critical]}
  check: {type: keyword, desc: "Nom du contrôle de supervision"}
  message: {type: text}
  status: {type: keyword, values: [open, closed]}
  closed_at: {type: date}
# État à l'heure de référence : une alerte fermée plus tard est encore ouverte.
as_of:
  - {field: closed_at, before: {status: open}}
retention: 90 jours
freshness: 1 min
limits: {max_hits: 200}
owner: équipe Supervision
