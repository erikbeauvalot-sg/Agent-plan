id: alerts-alertmanager
kind: alerts
requires_env: [ALERTMANAGER_URL]
description: >
  Alertes de supervision gérées par Alertmanager : alertes actives, sévérité, silences.
  Interroger via list_alerts et list_silences ; alert_history donne les alertes passées
  (série ALERTS de Prometheus).
backend:
  type: alertmanager
  url: ${ALERTMANAGER_URL}               # ex. http://192.168.1.15:9093
  bearer_token_env: ALERTMANAGER_TOKEN   # facultatif
owner: Erik
