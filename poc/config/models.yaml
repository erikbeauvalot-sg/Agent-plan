# Choix du modèle par rôle d'agent : changer de fournisseur = changer ces lignes.
# Un rôle de sous-agent absent (host, logs, metrics, events, changes, generic) prend "subagent".
roles:
  lead:     {provider: azure, deployment: gpt-5.6-luna, reasoning: high}
  subagent: {provider: azure, deployment: gpt-5.6-luna, reasoning: medium}
  # Alternative locale, par exemple Ollama :
  # lead:     {provider: local, model: qwen3:14b}
  # subagent: {provider: local, model: qwen3:14b}
  # Claude, pour le POC à la maison uniquement (jamais avec des données de production) :
  # lead:     {provider: claude, model: claude-opus-5-5, reasoning: high}
  # subagent: {provider: claude, model: claude-opus-5-5, reasoning: medium}

providers:
  azure:
    adapter: azure_openai
    endpoint: ${AZURE_OPENAI_ENDPOINT}      # https://<ressource>.openai.azure.com
    api_version: 2025-04-01-preview
    auth: entra_id                          # ou api_key (lit AZURE_OPENAI_API_KEY)
  local:
    adapter: openai_compatible
    base_url: http://localhost:11434/v1     # Ollama ; vLLM : http://localhost:8000/v1
  claude:
    adapter: anthropic                      # clé lue dans ANTHROPIC_API_KEY (ou profil `ant auth login`)
    max_tokens: 16000                       # plancher par réponse, réflexion comprise
    fallbacks: default                      # relance un refus de filtre sur le modèle de repli recommandé
