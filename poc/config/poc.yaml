# Serveurs MCP lancés par l'orchestrateur (sous-processus stdio, lecture seule).
# demo: true      -> jeu « demo » (données factices)
# requires_env    -> jeu « maison » (sources réelles), lancé seulement si ces variables sont définies
# Les autres serveurs sont communs. Jeux actifs : --sources / DIAGAGENT_SOURCES (défaut : les deux).
mcp_servers:
  mcp-catalog: {module: diagagent.mcp_servers.catalog_server}
  mcp-elk:     {module: diagagent.mcp_servers.elk_demo_server, demo: true}
  mcp-cmdb:    {module: diagagent.mcp_servers.cmdb_demo_server, demo: true}
  mcp-metrics: {module: diagagent.mcp_servers.metrics_server}
  mcp-alerts:  {module: diagagent.mcp_servers.alerts_server, requires_env: [ALERTMANAGER_URL]}

budgets:
  lead: {max_tool_calls: 25, max_turns: 30}   # budgets des sous-agents : agents/<rôle>.yaml

orchestration:
  max_parallel: 6       # sous-agents simultanés
  max_subagents: 12     # sous-agents au total par question

runs_dir: runs
