id: impact-change
version: 2
status: active
description: >
  Un change a-t-il eu un impact ? On compare l'état des CI concernés avant et après la fenêtre
  d'intervention.
examples:
  - "Le change CHG0045678 a-t-il eu un impact ?"
  - "Le tuning de db-pay-02 d'hier soir a-t-il cassé quelque chose ?"
required_entities:
  change: "De quel change parles-tu (numéro CHG) ?"
hypotheses:
  - id: impact-direct
    signal: "erreurs, ruptures de métriques ou incidents sur les CI du change juste après la fenêtre"
  - id: impact-aval
    signal: "dégradation sur un CI qui dépend d'un CI du change juste après la fenêtre"
steps:
  - name: perimetre
    parallel:
      - {role: changes, objective: "contenu du change : CI, fenêtre d'intervention, description, état"}
      - {role: host,    objective: "CI qui dépendent des CI du change (les applications qui utilisent une base modifiée)"}
  - name: avant-apres
    parallel:
      - {role: metrics, objective: "métriques des CI du change et de leurs dépendants avant et après la fenêtre"}
      - {role: logs,    objective: "erreurs avant et après la fenêtre sur ces CI"}
      - {role: generic, objective: "incidents ouverts après la fenêtre sur ces CI", sources: [incidents]}
stop_when:
  - "impact constaté avec preuves, ou absence d'impact vérifiée sur les métriques, logs et incidents"
requalify: {}
output: [synthese, impact, chronologie, actions]
owner: équipe gestion des changements
