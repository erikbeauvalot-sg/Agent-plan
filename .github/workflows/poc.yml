name: POC

on:
  push:
    branches: [main]
    paths: ["poc/**", ".github/workflows/poc.yml"]
  # Toutes les PR passent les tests, même sans changement dans poc/ : le merge automatique en dépend.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,claude]'
      - run: python -m pytest -q

  # Interface (TypeScript, React) : types, lint, tests, puis le bundle versionné doit correspondre aux sources.
  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: poc/web-ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Bundle à jour
        run: |
          git diff --exit-code -- ../src/diagagent/web/static/dist || {
            echo "::error::Bundle périmé : lancer « cd poc/web-ui && npm run build » et commiter static/dist"; exit 1; }
          test -z "$(git status --porcelain -- ../src/diagagent/web/static/dist)" || {
            echo "::error::Fichiers du bundle non commités"; git status --porcelain -- ../src/diagagent/web/static/dist; exit 1; }

  # Merge automatique dès que les tests passent : PR vers main, ouverte depuis ce dépôt, hors brouillon.
  # Pour retenir une PR (relecture, travail en cours), l'ouvrir ou la repasser en brouillon (draft).
  merge:
    needs: [tests, interface]
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge "$PR" --repo "$REPO" --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
